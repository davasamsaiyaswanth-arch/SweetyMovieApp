name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip wget
          sudo apt-get install -y python3-pip python3-dev libffi-dev libssl-dev
          sudo apt-get install -y autoconf automake libtool pkg-config zlib1g-dev
          sudo apt-get install -y libncurses5-dev cmake m4 libtool-bin

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip==23.1.2 setuptools wheel
          pip install buildozer cython==3.1.0
          python -m pip install "pip>=23.0,<24.2"

      - name: Clean old Buildozer files
        run: |
          rm -rf .buildozer
          mkdir -p "$HOME/.buildozer/android/platform/android-sdk"

      - name: Install Android SDK and build tools
        shell: bash
        run: |
          set -euxo pipefail

          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          CMDLINE_TOOLS="$SDK_ROOT/cmdline-tools"

          mkdir -p "$CMDLINE_TOOLS"
          
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/android-cmdline-tools.zip
          unzip -q /tmp/android-cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"

          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$SDK_ROOT/build-tools/33.0.2" >> $GITHUB_PATH

          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses

          sdkmanager --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          test -f "$SDK_ROOT/build-tools/33.0.2/aidl"
          echo "aidl installed successfully:"
          "$SDK_ROOT/build-tools/33.0.2/aidl" --version

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sweety-movie-apk
          path: bin/*.apk
