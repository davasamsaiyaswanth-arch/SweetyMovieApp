name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CFLAGS: "-Wno-error=implicit-function-declaration -Wno-error=implicit-int"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libltdl-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==24.0 setuptools wheel
          pip install buildozer cython==0.29.36

      - name: Pre-install Android SDK and Build-Tools 33.0.2
        run: |
          mkdir -p $HOME/.android/licenses
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $HOME/.android/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $HOME/.android/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1059b8ea6b2ac" >> $HOME/.android/licenses/android-sdk-license
          cp $HOME/.android/licenses/android-sdk-license $HOME/.buildozer/android/platform/android-sdk/licenses/
          yes | sdkmanager --licenses || true
          sdkmanager --install "build-tools;33.0.2" "platforms;android-33" "platform-tools" || true
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/build-tools
          ln -sf $ANDROID_HOME/build-tools/33.0.2 $HOME/.buildozer/android/platform/android-sdk/build-tools/33.0.2 || true

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SweetyMovieApp-APK
          path: bin/*.apk
