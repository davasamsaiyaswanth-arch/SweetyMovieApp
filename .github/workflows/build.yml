name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential git zip unzip \
            python3-pip python3-dev libffi-dev libssl-dev \
            autoconf automake libtool pkg-config zlib1g-dev \
            libncurses5-dev cmake m4 libtool-bin

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "pip>=23.0,<24.2"
          python -m pip install buildozer cython==3.1.0

      - name: Accept Android Licenses
        run: |
          mkdir -p "$HOME/.android/licenses"
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > "$HOME/.android/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$HOME/.android/licenses/android-sdk-license"
          echo "24333f8a63b6825ea9c5514f83c1051866b07ae" >> "$HOME/.android/licenses/android-sdk-license"

      - name: Build APK
        run: |
          rm -rf .buildozer
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sweety-movie-apk
          path: bin/*.apk
