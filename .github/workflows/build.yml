
name: Build SweetyMovieApp APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            libsqlite3-dev \
            libbz2-dev \
            liblzma-dev \
            libreadline-dev \
            gettext \
            autopoint

      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36

      - name: Clean old Buildozer files
        run: |
          rm -rf "$HOME/.buildozer"
          rm -rf bin

      - name: Set Android SDK path
        run: |
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK_ROOT/cmdline-tools"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Install Android command line tools
        run: |
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O /tmp/cmdline-tools.zip

          unzip -q /tmp/cmdline-tools.zip \
            -d "$SDK_ROOT/cmdline-tools"

          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" \
            "$SDK_ROOT/cmdline-tools/latest"

          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Configure SDK manager
        run: |
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK_ROOT/tools/bin"

          ln -sf \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/tools/bin/sdkmanager"

          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android licenses
        run: |
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          yes | sdkmanager \
            --sdk_root="$SDK_ROOT" \
            --licenses || true

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          sdkmanager \
            --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify AIDL
        run: |
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          echo "Installed Build Tools:"
          ls -la "$SDK_ROOT/build-tools"

          test -x "$SDK_ROOT/build-tools/35.0.0/aidl"

          echo "AIDL file found:"
          ls -l "$SDK_ROOT/build-tools/35.0.0/aidl"

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sweety-movie-apk
          path: bin/*.apk
          if-no-files-found: error
