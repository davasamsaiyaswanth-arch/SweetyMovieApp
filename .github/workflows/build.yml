
name: Build SweetyMovieApp APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      # 1. Checkout repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Setup Python 3.11
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Setup Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 4. Install system dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            wget \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libffi-dev \
            libssl-dev \
            cmake \
            libltdl-dev \
            libbz2-dev \
            liblzma-dev \
            libsqlite3-dev \
            libreadline-dev

      # 5. Install Buildozer
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "buildozer==1.5.0" \
            "cython==0.29.36"

      # 6. Clean previous build files
      - name: Clean Buildozer cache
        run: |
          rm -rf .buildozer
          rm -rf bin

      # 7. Check Buildozer configuration
      - name: Check Buildozer
        run: |
          buildozer --version

          test -f buildozer.spec

      # 8. Build APK
      - name: Build APK
        run: |
          python -m buildozer -v android debug

      # 9. Upload APK
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SweetyMovieApp-APK
          path: |
            bin/*.apk
            .buildozer/android/platform/build-*/dists/*/build/outputs/apk/**/*.apk
          if-no-files-found: warn
