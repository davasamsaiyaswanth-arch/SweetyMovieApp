
name: Build SweetyMovieApp APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:

      # 1. Download project source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python 3.11
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Setup Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 4. Install Linux dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            autopoint \
            gettext

      # 5. Install Python build tools
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.6.0
          python -m pip install Cython==0.29.34

      # 6. Check required project files
      - name: Check project files
        run: |
          test -f main.py
          test -f buildozer.spec

      # 7. Remove old broken build files
      - name: Clean previous build
        run: |
          rm -rf .buildozer
          rm -rf bin

      # 8. Build Android APK
      - name: Build APK
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
        run: |
          python -m buildozer -v android debug

      # 9. Check APK output
      - name: Check APK
        run: |
          find bin -type f -name "*.apk" -print
          test -n "$(find bin -type f -name '*.apk' -print -quit)"

      # 10. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SweetyMovieApp-debug-apk
          path: bin/*.apk
          if-no-files-found: error
